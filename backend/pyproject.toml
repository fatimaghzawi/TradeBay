[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradebay-backend"
version = "0.1.0"
description = "TradeBay modular monolith API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "TradeBay" }]
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "motor>=3.6.0",
  "pymongo>=4.10.0,<4.12",
  "pyjwt>=2.10.0",
  "bcrypt>=4.2.0",
  "structlog>=24.4.0",
  "python-multipart>=0.0.18",
  "httpx>=0.28.0",
  "orjson>=3.10.0",
  "reportlab>=4.2.0",
  "sentry-sdk[fastapi]>=2.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-passlib",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "UP046", "UP047", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Motor binds to one event loop; session fixtures and tests must share it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["motor.*", "pymongo.*", "bcrypt"]
ignore_missing_imports = true
