services:
  mongodb:
    image: mongo:7
    container_name: tradebay-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tradebay
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s
    networks:
      - tradebay

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: tradebay-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      MONGODB_DATABASE: tradebay
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - tradebay

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: tradebay-frontend
    restart: unless-stopped
    environment:
      # Same-origin browser calls via Next rewrites (httpOnly cookies).
      # Do NOT set NEXT_PUBLIC_API_URL here — that forces cross-origin calls.
      API_PROXY_TARGET: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - tradebay

volumes:
  mongodb_data:

networks:
  tradebay:
    driver: bridge
